[project]
name = "crm-ticket-intelligence"
version = "0.1.0"
description = "Route consumer complaint narratives to a product line."
requires-python = ">=3.11"
readme = "README.md"
authors = [{ name = "Nishant Tyagi" }]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
